<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yogi</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2622;--felt:#1b4a3f;--felt2:#14382f;--ink:#e8efe9;--mute:#8fa9a0;--gold:#e9b44c;--line:#2d5c50;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.screen{display:none;height:100%;max-width:960px;margin:0 auto;padding:16px}
.screen.on{display:flex;flex-direction:column}
/* home */
#home{justify-content:center;align-items:center;text-align:center;gap:28px}
.logo{font-size:56px;font-weight:700;letter-spacing:.02em}
.logo span{color:var(--gold)}
.sub{color:var(--mute);margin-top:-18px}
.panel{width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
input{background:var(--felt2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%;font-size:17px}
input::placeholder{color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:500;cursor:pointer;background:var(--gold);color:#1d1606;font-size:17px}
.btn.alt{background:var(--felt);color:var(--ink);border:1px solid var(--line);padding:14px;width:auto}
.row{display:flex;gap:8px}
.row input{text-transform:uppercase;letter-spacing:.2em;text-align:center}
.me-note{color:var(--mute);font-size:14px;min-height:21px}
/* game */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--felt2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mute)}
.chip b{color:var(--ink);letter-spacing:.15em}
.icon-btn{background:var(--felt2);border:1px solid var(--line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:20px}
.banner{margin:12px 0 4px;padding:12px 16px;border-radius:14px;background:var(--felt2);border:1px solid var(--line)}
.banner small{color:var(--mute);display:block}
.banner strong{font-size:20px;font-weight:700}
.banner strong em{color:var(--gold);font-style:normal}
.stage{flex:1;position:relative;min-height:0}
.table{position:absolute;inset:6% 8%;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt2));border:6px solid #2a1f14;box-shadow:inset 0 0 0 2px #3b2c1c,0 12px 40px #0008}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:14px;align-items:center}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;width:84px;text-align:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#10201c;border:3px solid #0f2622;position:relative}
.seat.act .av{box-shadow:0 0 0 3px var(--gold),0 0 22px 4px #e9b44c88;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 3px var(--gold),0 0 30px 8px #e9b44caa}}
.seat .cnt{position:absolute;right:-8px;bottom:-4px;background:#0f2622;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:0 6px;color:var(--ink)}
.seat span.n{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* cards */
.card{width:64px;height:92px;border-radius:10px;position:relative;flex:none;box-shadow:0 3px 10px #0007}
.back{background:#2b6b5c var(--back,none) center/cover;border:2px solid #e8efe9}
.back::after{content:"";position:absolute;inset:6px;border:1px solid #e8efe955;border-radius:6px}
.face{background:#f4f1e8;color:#1c2b27;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;border:0;cursor:pointer}
.face .art{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff;background:var(--c);overflow:hidden}
.face .art img{width:100%;height:100%;object-fit:cover}
.hand{display:flex;justify-content:center;padding:14px 0 6px;height:132px;align-items:flex-end}
.hand .card{width:76px;height:108px;margin:0 -10px;transition:transform .15s;transform-origin:50% 120%;transform:rotate(var(--r)) translateY(var(--y,0))}
.hand .card:hover,.hand .card:focus-visible{transform:rotate(0) translateY(-18px)}
.hand .card.off{opacity:.45;pointer-events:none}
.deck{cursor:pointer;border:0;padding:0}
.hint{text-align:center;color:var(--mute);font-size:13px;padding-bottom:4px}
</style></head><body>

<section id="home" class="screen on">
  <h1 class="logo">Yo<span>gi</span></h1>
  <p class="sub">เกมการ์ดสนุกๆ เล่นกับเพื่อน</p>
  <div class="panel">
    <input id="name" maxlength="14" placeholder="ชื่อของคุณ" autocomplete="off">
    <button class="btn" id="create"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>สร้างห้อง</button>
    <div class="row"><input id="code" maxlength="4" placeholder="รหัสห้อง"><button class="btn alt" id="join">เข้าร่วม</button></div>
    <p class="me-note" id="note"></p>
  </div>
</section>

<section id="game" class="screen">
  <div class="top">
    <button class="icon-btn" id="leave" aria-label="ออกจากห้อง"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="chip">ห้อง <b id="room">ABCD</b></div>
  </div>
  <div class="banner" aria-live="polite"><small id="rd">รอบที่ 1</small><strong id="turn"></strong><small id="what"></small></div>
  <div class="stage"><div class="table"></div><div class="center" id="center"></div><div id="seats"></div></div>
  <div class="hand" id="hand"></div>
  <button class="btn" id="start" style="display:none;margin:0 auto 8px;width:auto">เริ่มเกม</button>
  <p class="hint" id="hint"></p>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
// ---- ไอคอนการ์ด Action: ตอนใช้งานจริงใส่ img ให้แต่ละ action = "cardaction/ชื่อไฟล์.png" ----
const BACK_IMG = "/bgcard.png"; // วางไฟล์ไว้ใน public/
const ACTIONS = {
  skip:{t:"ข้ามตา",c:"#d9644f",img:"",svg:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'},
  rev:{t:"ย้อนทิศ",c:"#4f8fd9",img:"",svg:'<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/>'},
  draw:{t:"จั่ว 2 ใบ",c:"#8a63c9",img:"",svg:'<rect x="8" y="3" width="12" height="16" rx="2"/><path d="M4 7v12a2 2 0 002 2h9"/><path d="M14 8v6M11 11h6"/>'},
  shield:{t:"โล่กัน",c:"#3fa57c",img:"",svg:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'},
  swap:{t:"สลับมือ",c:"#d9a23f",img:"",svg:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>'}
};
const ico=(k)=>ACTIONS[k].img?`<img src="${ACTIONS[k].img}" alt="">`:`<svg class="i" viewBox="0 0 24 24">${ACTIONS[k].svg}</svg>`;
const faceCard=(k,tag="div")=>`<${tag} class="card face" style="--c:${ACTIONS[k].c}" data-k="${k}"><span class="art">${ico(k)}</span>${ACTIONS[k].t}</${tag}>`;
const keys=Object.keys(ACTIONS), rnd=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
if(BACK_IMG)document.documentElement.style.setProperty("--back",`url(${BACK_IMG})`);

// ---- ตัวตน: ชื่อ + id สุ่ม เก็บในเครื่อง / จำห้องล่าสุดเพื่อกลับเข้าเกม ----
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const store=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL=["#e9b44c","#7cc4a8","#e98a8a","#8fb4f0","#c9a0e8","#f0a46a"];
let me={},S=null;
try{me=JSON.parse(get("yogi_user")||"{}")}catch(e){}
if(me.name){$("name").value=me.name;$("note").textContent="ยินดีต้อนรับกลับ "+me.name}
const show=id=>document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));
const socket=io();
function go(create,c,quiet){
  const n=$("name").value.trim();
  if(!n){$("note").textContent="กรุณาใส่ชื่อก่อน";$("name").focus();return}
  me={name:n,id:me.id||(crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random())};
  store("yogi_user",JSON.stringify(me));
  socket.emit("join",{create,code:c,uid:me.id,name:n},r=>{
    if(r.error){if(!quiet)$("note").textContent=r.error;store("yogi_room",null);return}
    store("yogi_room",r.code);show("game");
  });
}
$("create").onclick=()=>go(true);
$("join").onclick=()=>{const c=$("code").value.trim().toUpperCase();if(c.length<4){$("note").textContent="ใส่รหัสห้อง 4 ตัวอักษร";return}go(false,c)};
$("leave").onclick=()=>{socket.emit("leave");store("yogi_room",null);S=null;show("home")};
$("start").onclick=()=>socket.emit("start");
socket.on("connect",()=>{const c=get("yogi_room");if(c&&me.id)go(false,c,true)});
socket.on("state",s=>{S=s;render()});

function render(){
  const ps=S.players,n=ps.length,i0=Math.max(0,ps.findIndex(p=>p.id===me.id));
  const mine=S.started&&!S.over&&ps[S.turn].id===me.id;
  $("room").textContent=S.code;
  $("seats").innerHTML=ps.map((p,j)=>{
    const o=(j-i0+n)%n,a=(90+o*360/n)*Math.PI/180,x=50+43*Math.cos(a),y=50+46*Math.sin(a);
    return `<div class="seat ${S.started&&!S.over&&j===S.turn?"act":""}" style="left:${x}%;top:${y}%;opacity:${p.on?1:.45}"><div class="av" style="background:${COL[j%6]}">${esc([...p.name][0])}${S.started?`<span class="cnt">${p.count}</span>`:""}</div><span class="n">${esc(p.name)}${p.id===me.id?" (คุณ)":""}</span></div>`}).join("");
  $("center").innerHTML=`<button class="card back deck" id="deck" aria-label="จั่วการ์ด"></button>${S.pile?faceCard(S.pile,"div"):'<div class="card" style="border:2px dashed var(--line);box-shadow:none"></div>'}`;
  $("deck").onclick=()=>{if(mine)socket.emit("draw")};
  $("hand").innerHTML=S.hand.map((k,i)=>{const m=i-(S.hand.length-1)/2;
    return `<button class="card face ${mine?"":"off"}" style="--r:${m*6}deg;--y:${Math.abs(m)*4}px;--c:${ACTIONS[k].c}"><span class="art">${ico(k)}</span>${ACTIONS[k].t}</button>`}).join("");
  document.querySelectorAll("#hand .card").forEach((el,i)=>el.onclick=()=>mine&&socket.emit("play",i));
  $("rd").textContent=S.started?"รอบที่ "+S.round:"ห้องรอผู้เล่น";
  $("turn").innerHTML=S.over?"จบเกม":!S.started?`ผู้เล่น <em>${n}</em> คน`:mine?"ตาของ <em>คุณ</em>":`ตาของ <em>${esc(ps[S.turn].name)}</em>`;
  $("what").textContent=S.msg||"";
  const canStart=S.host===me.id&&(!S.started||S.over)&&n>=2;
  $("start").style.display=canStart?"flex":"none";
  $("start").textContent=S.over?"เล่นอีกรอบ":"เริ่มเกม";
  $("hint").textContent=!S.started?(S.host===me.id?(n<2?"แชร์รหัสห้องให้เพื่อน (ต้องมีอย่างน้อย 2 คน)":"พร้อมแล้วกดเริ่มเกม"):"รอเจ้าของห้องเริ่มเกม"):S.over?"":mine?"เลือกการ์ดจากมือ หรือแตะกองจั่ว":"รอผู้เล่นคนอื่น…";
}
</script></body></html>
